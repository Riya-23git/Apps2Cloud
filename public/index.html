<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Apply the saved theme before first paint to avoid a flash of the wrong theme -->
    <script>var t='light';try{var s=localStorage.getItem('pt-theme');if(s==='dark')t=s}catch(e){}document.documentElement.setAttribute('data-theme',t)</script>

    <!-- Default SEO (overridden by react-helmet per page) -->
    <title>Apps2Cloud — Software Development Company in Tamil Nadu</title>
    <meta data-rh="true" name="description" content="Apps2Cloud builds ERP systems, billing software, mobile apps and business websites for Tamil Nadu businesses. 50+ projects. Call +91 70102 13133." />
    <meta data-rh="true" name="robots" content="index, follow" />
    <link data-rh="true" rel="canonical" href="https://apps2cloud.in/" />

    <!-- Open Graph defaults -->
    <meta data-rh="true" property="og:type"        content="website" />
    <meta data-rh="true" property="og:url"         content="https://apps2cloud.in/" />
    <meta data-rh="true" property="og:title"       content="Apps2Cloud — Software Development Tamil Nadu" />
    <meta data-rh="true" property="og:description" content="ERP, billing software, mobile apps and websites for Tamil Nadu businesses." />
    <meta data-rh="true" property="og:image"       content="https://apps2cloud.in/og-image.png" />

    <!-- Local Business Schema -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "LocalBusiness",
      "name": "Apps2Cloud",
      "description": "Software development company in Tamil Nadu building ERP, billing software, mobile apps and websites.",
      "url": "https://apps2cloud.in",
      "telephone": "+917010213133",
      "email": "hello@apps2cloud.in",
      "address": {
        "@type": "PostalAddress",
        "addressRegion": "Tamil Nadu",
        "addressCountry": "IN"
      },
      "geo": {
        "@type": "GeoCoordinates",
        "latitude": "9.9252",
        "longitude": "78.1198"
      },
      "openingHours": "Mo-Sa 09:30-18:30",
      "priceRange": "₹₹",
      "areaServed": "Tamil Nadu",
      "hasOfferCatalog": {
        "@type": "OfferCatalog",
        "name": "Software Services",
        "itemListElement": [
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "ERP Software Development" }},
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "GST Billing Software" }},
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Mobile App Development" }},
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Business Website Development" }},
          { "@type": "Offer", "itemOffered": { "@type": "Service", "name": "Shop Management Software" }}
        ]
      }
    }
    </script>

    <!-- ── Favicon / Logo ── -->
<link rel="icon" type="image/svg+xml" href="%PUBLIC_URL%/logo-mark.svg" />
    <link rel="icon" type="image/x-icon"  href="%PUBLIC_URL%/favicon.ico" />
<link rel="icon" type="image/png" sizes="32x32" href="%PUBLIC_URL%/favicon-32x32.png" />
<link rel="icon" type="image/png" sizes="16x16" href="%PUBLIC_URL%/favicon-16x16.png" />
<link rel="apple-touch-icon" sizes="180x180"    href="%PUBLIC_URL%/apple-touch-icon.png" />

<!-- ── For Google Search result icon ── -->
<link rel="shortcut icon" href="%PUBLIC_URL%/favicon.ico" />

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  </head>
  <body>
    <noscript>
      Apps2Cloud is a software development company in Tamil Nadu.
      We build ERP systems, billing software, mobile apps and business websites.
      Call us: +91 70102 13133
    </noscript>
    <div id="root"></div>
  </body>
</html>
